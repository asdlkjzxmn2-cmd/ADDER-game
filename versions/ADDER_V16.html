/* Single-player transport. Every accepted action is committed to IndexedDB
   before acknowledgement; transactions also serialize actions across tabs. */
globalThis.AdderLocal=(()=>{
  const KEY='current-game';
  const database=new Promise((resolve,reject)=>{
    const req=indexedDB.open('adder-local-v1',1);
    req.onupgradeneeded=()=>req.result.createObjectStore('games');
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(new Error('브라우저 저장소를 열 수 없습니다. 일반 브라우저 모드로 열어주세요.'));
  });
  database.catch(()=>{});
  async function transact(playerId,action){
    const db=await database;
    return new Promise((resolve,reject)=>{
      const tx=db.transaction('games','readwrite'), store=tx.objectStore('games');
      let result, failure;
      const req=store.get(KEY);
      req.onsuccess=()=>{
        try{
          let state=req.result||AdderLogic.setup([playerId]);
          const owner=state.players[0];
          if(action){
            const check=AdderLogic.validateAction(state,owner,action);
            if(!check.ok)throw new Error(check.error);
            state=AdderLogic.applyAction(state,owner,action);
          }
          result={ok:true,view:AdderLogic.viewFor(state,owner)};
          store.put(state,KEY);
        }catch(e){failure=e;tx.abort();}
      };
      tx.oncomplete=()=>resolve(result);
      tx.onabort=()=>reject(failure||new Error('자동 저장에 실패했습니다. 저장 공간과 브라우저 설정을 확인해주세요.'));
      tx.onerror=()=>{};
    });
  }
  class Connection extends EventTarget{
    readyState=0;
    queue=Promise.resolve();
    constructor(playerId){
      super();this.playerId=playerId;
      setTimeout(()=>{this.readyState=1;this.dispatchEvent(new Event('open'));},0);
    }
    emit(value){this.dispatchEvent(new MessageEvent('message',{data:JSON.stringify(value)}));}
    send(raw){
      if(raw==='__ping')return;
      this.queue=this.queue.then(async()=>{
        const m=JSON.parse(raw);
        if(m.type!=='join'&&m.type!=='action')throw Error('지원하지 않는 로컬 요청입니다.');
        const data=await transact(this.playerId,m.type==='action'?m.action:null);
        this.emit({type:'state',view:data.view});
      }).catch(e=>this.emit({type:'error',error:e.message}));
    }
    importBundle(bundle){
      const job=this.queue.then(()=>transact(this.playerId,{type:'importSaveFile',bundle}));
      this.queue=job.catch(()=>{});return job;
    }
  }
  return {Connection};
})();

function act(b){
  const t=b.dataset.action,id=b.dataset.id;
  if(t==="reportMaliciousReview")send({type:t,caseId:b.dataset.case});
  else if(t==="sponsorInfluencer"){if(!selectedInfluencerId||!sponsorProductId)return toast("인플루언서와 협찬 상품을 선택해주세요.",true);send({type:t,influencerId:selectedInfluencerId,productId:sponsorProductId,color:Number(sponsorColor||0)});}
  else if(t==="marketRefresh"){marketCart={};send({type:t});}
  else if(t==="discoverSupplier")send({type:t});
  else if(t==="marketOrder"){const sid=b.dataset.supplier,items=marketCart[sid]||[];if(!items.length)return toast("이 가게 주문이 비어 있습니다.",true);pendingCartClear={type:"market",supplierId:sid};send({type:t,supplierId:sid,items});}
  else if(t==="reorderOrder"){if(!reorderCart.length)return toast("장바구니가 비어 있습니다.",true);pendingCartClear={type:"reorder"};send({type:t,items:reorderCart});}
  else if(t==="setPrice")send({type:t,id,price:Number($(`#price-${id}`).value)});
  else if(t==="shoot")send({type:t,id,method:b.dataset.method,color:picked(id),model:getModel(id,V.inventory[id])});
  else if(t==="postReel")send({type:t,format:b.dataset.format});
  else if(t==="upgradeSite")send({type:t});
  else if(t==="leaseStore")send({type:t,locationId:b.dataset.location});
  else if(t==="expandStore")send({type:t});

// Move the real bound controls into one viewport dock: no duplicate carts or handlers.
var orderDockEntries=[],orderDockActive=null,orderDockFrame=0;
function setupOrderDock(){
  let dock=document.getElementById('orderDock');
  if(!dock){dock=document.createElement('div');dock.id='orderDock';dock.setAttribute('aria-label','현재 거래처 주문');document.body.appendChild(dock)}
  dock.replaceChildren();dock.hidden=true;orderDockEntries=[];orderDockActive=null;
  const carts=active==='market'?[...document.querySelectorAll('.market-shop-group > .shop-cart')]:active==='reorder'?[...document.querySelectorAll('#panel .checkout-card')]:[];
  for(const cart of carts){
    const anchor=document.createElement('div');anchor.className='order-dock-anchor';cart.before(anchor);cart.hidden=true;
    orderDockEntries.push({cart,anchor,section:active==='market'?cart.closest('.market-shop-group'):document.getElementById('panel')});
  }
  requestAnimationFrame(updateOrderDock);
}
function updateOrderDock(){
  const dock=document.getElementById('orderDock');if(!dock)return;
  let current=null;
  const hud=document.querySelector('.sticky-shell').getBoundingClientRect();
  const top=document.querySelector('.workspace-body')?.getBoundingClientRect().top||Math.max(0,hud.bottom);
  const probe=top+(innerHeight-top)*.35;
  for(const entry of orderDockEntries){
    const r=entry.section.getBoundingClientRect();
    if(r.top<=probe&&r.bottom>probe){current=entry;break;}
  }
  if(!current)current=orderDockEntries.find(e=>{const r=e.section.getBoundingClientRect();return r.top<innerHeight-100&&r.bottom>top});
  if(!current&&orderDockEntries.length){const last=orderDockEntries.at(-1);if(last.section.getBoundingClientRect().bottom<=probe)current=last;}
  if(current!==orderDockActive){
    if(orderDockActive){orderDockActive.cart.hidden=true;orderDockActive.anchor.after(orderDockActive.cart)}
    orderDockActive=current;
    if(current){current.cart.hidden=false;dock.appendChild(current.cart);dock.dataset.supplier=current.section.dataset.shopId||'reorder'}
  }
  dock.hidden=!current;
  if(current){
    const r=current.section.getBoundingClientRect(),left=Math.max(8,r.left),right=Math.min(innerWidth-8,r.right);
    dock.style.left=left+'px';dock.style.width=Math.max(0,right-left)+'px';
    const height=dock.getBoundingClientRect().height;
    for(const entry of orderDockEntries)entry.anchor.style.height=(height+16)+'px';
  }
}
function queueOrderDock(){if(orderDockFrame)return;orderDockFrame=requestAnimationFrame(()=>{orderDockFrame=0;updateOrderDock()})}
document.addEventListener('scroll',queueOrderDock,{passive:true,capture:true});
window.addEventListener('resize',queueOrderDock,{passive:true});

var workspacePositions={};
function rememberWorkspace(){

 if(!scene)return;

}
function restoreWorkspace(){
 for(const [name,top] of workspacePositions[active]||[]){const el=document.querySelector(`[data-scroll-pane="${name}"]`);if(el)el.scrollTop=top}
}
function setupWorkspace(){
 const panel=document.getElementById('panel');

 if(!enabled)return;
